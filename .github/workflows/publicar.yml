name: Publicar en Instagram

on:
  schedule:
    # Post del día: 01:17 UTC = 22:17 en Argentina (19:17 en México, 20:17 en Colombia).
    - cron: '17 1 * * *'
    # Reel del día, si hay: 15:17 UTC = 12:17 en Argentina (9:17 en México, 10:17 en Colombia).
    - cron: '17 15 * * *'
  # Si cambia el script o el workflow, corre solo una prueba (no publica nada).
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      modo:
        description: 'probar = valida todo sin publicar · publicar = publica el post que toca hoy · reel = publica el reel que toca hoy'
        type: choice
        options: [probar, publicar, reel]
        default: probar

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODO: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 15 * * *' && 'reel' || 'publicar') || inputs.modo || 'probar' }}
        run: |
          node --version
          node scripts/publicar.mjs

      - name: Guardar registro de lo publicado
        # Corre aunque falle la historia: el post ya salió y hay que anotarlo para no repetirlo.
        if: always()
        run: |
          if [ -n "$(git status --porcelain posts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts
            git commit -m "Publicado en Instagram: $(git status --porcelain posts | head -n1 | awk '{print $2}' | cut -d/ -f2)"
            git push
          fi
